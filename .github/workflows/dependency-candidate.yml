name: Dependency hardening
on:
  push:
    branches: [qualification/dependency-r1.1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.10'
          enable-cache: false
      - run: uv python install 3.12.16
      - run: uv run --no-project --python 3.12.16 python -c "import sys,platform,os; assert sys.version_info[:3]==(3,12,16); assert (sys.platform,platform.machine().lower()) == (('win32','amd64') if os.environ['RUNNER_OS']=='Windows' else ('darwin','arm64'))"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-uv-lock
          run-id: 45949495356
          github-token: ${{ github.token }}
      - run: uv run --no-project --python 3.12.16 python -c "import hashlib; assert hashlib.sha256(open('uv.lock','rb').read()).hexdigest()=='c68e7e8cb941f0f21892f27f2b7ab03e619b0f19763cbe8478eb4195643e3c98'"
      - run: uv lock --check
      - run: uv sync --locked --group dev --group test --group build --no-build
      - run: uv pip check
      - run: uv run --locked --no-sync python scripts/qualification/native_probe.py
      - name: Known vulnerability scan
        run: uvx --python 3.12.16 --from pip-audit==2.10.1 pip-audit --strict --no-deps --disable-pip -r evidence/installed.txt -f json -o evidence/vulnerabilities.json
      - name: CycloneDX inventory
        if: always()
        run: uvx --python 3.12.16 --from cyclonedx-bom==8.0.1 cyclonedx-py requirements evidence/installed.txt --output-format JSON --output-file evidence/sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-${{ runner.os }}
          path: evidence/
          if-no-files-found: error
  admission:
    needs: native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require both native jobs
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: evidence-*
          path: reports
      - run: python3 scripts/qualification/admission.py
